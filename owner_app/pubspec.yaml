name: pg_manager_owner_app
description: Owner mobile app for PG Manager SaaS.
publish_to: 'none'
version: 0.1.0+1

environment:
  sdk: '>=3.4.0 <4.0.0'

dependencies:
  flutter:
    sdk: flutter
  # Kept despite zero direct `CupertinoIcons.*` uses: Flutter's own Cupertino
  # widgets reference the font, and dropping it makes the icon tree-shaker warn
  # "Expected to find fonts for CupertinoIcons" — i.e. a glyph would render
  # blank. Tree-shaking already reduces the font to 848 bytes in the APK.
  cupertino_icons: ^1.0.8
  http: ^1.2.2
  flutter_secure_storage: ^9.2.2
  provider: ^6.1.2
  go_router: ^14.2.7
  intl: ^0.19.0
  local_auth: ^2.3.0
  local_auth_android: ^1.0.46
  shared_preferences: ^2.3.3
  file_selector: ^1.0.4
  url_launcher: ^6.3.0
  # Path grammar for the one inline SVG glyph (see widgets/svg_path_icon.dart).
  # Replaces flutter_svg, whose vector_graphics compiler is far more machinery
  # than a single static path needs.
  path_parsing: ^1.1.0
  qr_flutter: ^4.1.0
  pdf: ^3.13.0
  printing: ^5.15.0
  path_provider: ^2.1.6
  open_filex: ^4.7.0

dev_dependencies:
  flutter_test:
    sdk: flutter
  flutter_lints: ^4.0.0
  flutter_launcher_icons: ^0.13.1

flutter_launcher_icons:
  android: "ic_launcher"
  ios: true
  image_path: "assets/images/app_icon.png"
  remove_alpha_ios: true
  min_sdk_android: 21
  adaptive_icon_background: "#FFFFFF"
  adaptive_icon_foreground: "assets/images/app_icon.png"
  web:
    generate: false

flutter:
  uses-material-design: true
  assets:
    - assets/images/
