# =============================================================================
# Redis 7.4 — production configuration for PG Manager
#
# Mounted read-only at /usr/local/etc/redis/redis.conf.
#
# NO PASSWORD IS SET IN THIS FILE. It is appended at container start from the
# REDIS_PASSWORD environment variable:
#     redis-server /usr/local/etc/redis/redis.conf --requirepass "$REDIS_PASSWORD"
# Keeping it out of the file means the secret lives only in .env, and this config
# can be committed, copied and backed up freely.
#
# Role in this system: Redis is a CACHE, not a system of record. The application's
# CacheErrorHandler is fail-open — every cached read falls back to a direct database
# query when Redis is unavailable — so losing this instance degrades latency, never
# correctness. Every design choice below follows from that.
# =============================================================================

# -----------------------------------------------------------------------------
# Network
# -----------------------------------------------------------------------------

# Listen on all interfaces INSIDE the container. Safe here and only here: the
# container sits on an `internal: true` Docker network with no published port and no
# route to the internet. On a host without that isolation this line would be the
# single most dangerous setting in the file.
bind 0.0.0.0
port 6379

# Protected mode is redundant once requirepass is set, but leaving it on costs
# nothing and closes the window if the password is ever accidentally removed.
protected-mode yes

# Pending-connection backlog. Must not exceed the kernel's somaxconn.
tcp-backlog 511

# Detect a peer that vanished without a FIN (container killed, network partition).
# Without this, dead connections occupy client slots until the OS eventually gives
# up — which can be hours.
tcp-keepalive 300

# 0 = never close an idle client. Lettuce (Spring's Redis driver) holds long-lived
# multiplexed connections and reconnecting them on a timeout causes latency spikes.
timeout 0

# -----------------------------------------------------------------------------
# General
# -----------------------------------------------------------------------------

# Never daemonize under Docker: the container's lifetime is the foreground process.
daemonize no
supervised no

# Empty string = log to stdout, where Docker's json-file driver captures it and the
# rotation configured in docker-compose.yml applies. Writing to a file inside a
# read-only container would fail, and an unrotated log file would grow forever.
logfile ""
loglevel notice

# All application cache keys are prefixed `pgm:cache:` and every key leads with the
# organizationId for multi-tenancy safety. One database is sufficient; SELECT-based
# separation is discouraged and unsupported in cluster mode.
databases 1

# -----------------------------------------------------------------------------
# Memory
#
# maxmemory MUST be below the container limit (1G in docker-compose.yml). The gap is
# not slack: Redis's own overhead — replication buffers, client output buffers, the
# copy-on-write pages a background RDB save creates — is not counted against
# maxmemory. Setting maxmemory equal to the container limit is the standard way to
# get a Redis container OOM-killed mid-snapshot.
# -----------------------------------------------------------------------------
maxmemory 768mb

# allkeys-lru: when full, evict the least-recently-used key regardless of TTL.
#
# This is the correct policy for a pure cache and the wrong one for anything durable.
# The alternative, volatile-lru, only evicts keys that carry a TTL — and if the
# working set ever exceeds memory with no evictable keys, Redis starts returning OOM
# errors on writes instead of making room. For a fail-open cache, silently dropping
# the coldest entry is always better than erroring.
maxmemory-policy allkeys-lru

# Sample size for the approximated LRU. 5 is the default; 10 is measurably closer to
# true LRU for a few percent more CPU, which is a good trade at this key count.
maxmemory-samples 10

# -----------------------------------------------------------------------------
# Persistence — RDB snapshots
#
# Enabled, though a pure cache does not strictly need it. The benefit is a warm
# start: after a deploy or host reboot, Redis reloads the previous key set instead of
# forcing every cached read model (FACILITY_TREE, ROOM_SUMMARY, PROPERTY_STATS,
# VACANT_BEDS, SHARING_PRICES, ORG_FEATURES) to be recomputed from MySQL at once —
# a thundering herd against the database at exactly the moment it is least wanted.
#
# If you would rather have a strictly ephemeral cache, comment out all three `save`
# lines and set appendonly to no. Nothing in the application depends on persistence.
# -----------------------------------------------------------------------------
save 900 1        # after 15 min if >= 1 key changed
save 300 10       # after  5 min if >= 10 keys changed
save 60 10000     # after  1 min if >= 10,000 keys changed

# Keep accepting writes even if the last background save failed. The default (`yes`)
# is right for a datastore — it makes a failing disk loudly break writes. For a cache
# it would turn a full disk into a total application slowdown, when simply not
# persisting is the harmless option.
stop-writes-on-bgsave-error no

rdbcompression yes
rdbchecksum yes
dbfilename dump.rdb
dir /data

# -----------------------------------------------------------------------------
# Persistence — AOF
#
# Runs alongside RDB. On restart Redis loads the AOF (it is the more complete of the
# two), and the RDB acts as the compact baseline the AOF rewrites against.
# -----------------------------------------------------------------------------
appendonly yes
appendfilename "appendonly.aof"
appenddirname "appendonlydir"

# everysec — fsync once per second.
#
# The three options are `always` (fsync every write: durable, and roughly an order of
# magnitude slower), `everysec` (at most one second of loss), and `no` (leave it to
# the kernel, potentially 30s of loss). For a cache whose entries are all
# reconstructible from MySQL, `always` buys durability that has no value and costs
# throughput on network-attached block storage. `everysec` is the right point.
appendfsync everysec

# During a background AOF rewrite, skip the fsync. Prevents the write latency spike
# that occurs when the main thread's fsync queues behind the rewrite's disk I/O.
no-appendfsync-on-rewrite yes

# Rewrite the AOF when it has doubled in size, but not while it is still trivially
# small. Keeps the file from growing unbounded with superseded writes.
auto-aof-rewrite-percentage 100
auto-aof-rewrite-min-size 64mb

# Load a truncated AOF (from an unclean shutdown) rather than refusing to start.
# Correct for a cache: a slightly incomplete warm set beats no Redis at all.
aof-load-truncated yes

# Write the RDB-format preamble into the AOF. Faster rewrites, smaller files.
aof-use-rdb-preamble yes

# -----------------------------------------------------------------------------
# Slow log
#
# In-memory ring buffer, inspected with SLOWLOG GET. Read it when the application's
# cache layer itself is the suspect: an entry here almost always means an oversized
# value (a cached FACILITY_TREE for a very large organization) or an accidental
# KEYS/SMEMBERS over a big collection.
#
# 10000 microseconds = 10ms. Redis operations are sub-millisecond; anything past 10ms
# is pathological, not merely slow.
# -----------------------------------------------------------------------------
slowlog-log-slower-than 10000
slowlog-max-len 128

# Latency monitor: records events exceeding 100ms. `LATENCY DOCTOR` reads it.
latency-monitor-threshold 100

# -----------------------------------------------------------------------------
# Client output buffers
#
# A hard cap so one misbehaving client cannot balloon Redis's memory beyond
# maxmemory. `normal 0 0 0` (unlimited) is the default and is fine for a trusted,
# network-isolated client; the pubsub limits matter only if pubsub is ever used.
# -----------------------------------------------------------------------------
client-output-buffer-limit normal 0 0 0
client-output-buffer-limit replica 256mb 64mb 60
client-output-buffer-limit pubsub 32mb 8mb 60

# -----------------------------------------------------------------------------
# Dangerous commands
#
# Renamed to an empty string, which removes them entirely.
#   FLUSHALL / FLUSHDB — one typo wipes every organization's cache at once. The
#                        application evicts by annotation; it never needs these.
#   KEYS               — O(N) over the whole keyspace, blocking the single event
#                        loop. Use SCAN.
#   CONFIG             — lets a client rewrite this configuration at runtime,
#                        including requirepass and dir (a known RCE vector).
#
# To run one of these during a genuine incident, exec into the container and start a
# throwaway redis-cli against a server launched without this config, or temporarily
# comment the line and restart.
# -----------------------------------------------------------------------------
rename-command FLUSHALL ""
rename-command FLUSHDB ""
rename-command KEYS ""
rename-command CONFIG ""
rename-command DEBUG ""

# -----------------------------------------------------------------------------
# Misc
# -----------------------------------------------------------------------------

# Background defragmentation. Worth enabling for an LRU cache, where the constant
# churn of differently-sized values fragments the allocator over weeks of uptime.
activedefrag yes
active-defrag-ignore-bytes 100mb
active-defrag-threshold-lower 10
active-defrag-threshold-upper 100

# Incrementally reclaim memory from expired keys rather than in one blocking pass.
hz 10
dynamic-hz yes

# Free memory on a large DEL in a background thread instead of blocking the event
# loop — including the eviction path, which matters under maxmemory pressure.
lazyfree-lazy-eviction yes
lazyfree-lazy-expire yes
lazyfree-lazy-server-del yes
lazyfree-lazy-user-del yes
