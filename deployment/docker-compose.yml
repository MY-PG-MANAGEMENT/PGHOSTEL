# =============================================================================
# PG Manager — LOCAL DEVELOPMENT ONLY
#
#   docker compose up -d                 # PostgreSQL + Redis, nothing else
#   docker compose --profile app up -d   # ...plus the API in a container
#   docker compose down                  # stop, keep data
#   docker compose down -v               # stop and DESTROY the local database
#
# This file is NOT how production runs. Production is Koyeb (application) plus a
# managed PostgreSQL and a managed Redis — see README.md. There is deliberately no
# nginx, no certbot, no backup/restore tooling and no server tuning here: every one
# of those is the managed provider's job now, and keeping a second, subtly different
# copy of them in the repo is how the two drift apart until the local one is wrong.
#
# The credentials below are intentionally weak and intentionally committed. They
# match the defaults in `backend/src/main/resources/application.yml`, so
# `./gradlew bootRun` connects with no flags and no local .env. Nothing here is ever
# reachable from outside your machine, and nothing here is used in production —
# production secrets live in Koyeb's environment variables and nowhere else.
# =============================================================================

name: pgmanager-dev

services:

  # ===========================================================================
  # PostgreSQL 17 — matches the managed major version used in production.
  #
  # No custom postgresql.conf. Tuning a local dev database is pointless (there is
  # no load to tune for), and on a managed provider you cannot supply one anyway,
  # so a tuned file here would only teach you settings you cannot use.
  # ===========================================================================
  postgres:
    image: postgres:17-alpine
    container_name: pgm-dev-postgres
    restart: unless-stopped

    environment:
      POSTGRES_DB:       ${POSTGRES_DB:-pg_manager}
      POSTGRES_USER:     ${POSTGRES_USER:-postgres}
      POSTGRES_PASSWORD: ${POSTGRES_PASSWORD:-postgres}
      # Keep the cluster in a subdirectory of the volume: if PGDATA is the mount
      # point itself, a stray file there makes initdb refuse to run on an
      # "existing, non-empty" directory.
      PGDATA:            /var/lib/postgresql/data/pgdata
      TZ:                ${TZ:-Asia/Kolkata}

    ports:
      # Published so the app can run from your IDE against localhost:5432.
      # Bound to loopback: on a laptop joining a café network, 0.0.0.0 would put a
      # database with the password `postgres` on the LAN.
      - "127.0.0.1:${POSTGRES_PORT:-5432}:5432"

    volumes:
      - pgdata:/var/lib/postgresql/data

    healthcheck:
      # PGPASSWORD is required: the psql leg fails with "no password supplied"
      # without it, and then the container never reports healthy.
      test: ["CMD-SHELL", "pg_isready -U \"$$POSTGRES_USER\" -d \"$$POSTGRES_DB\" -q && PGPASSWORD=\"$$POSTGRES_PASSWORD\" psql -U \"$$POSTGRES_USER\" -d \"$$POSTGRES_DB\" -tAc 'SELECT 1' >/dev/null 2>&1 || exit 1"]
      interval: 10s
      timeout: 5s
      retries: 10
      start_period: 30s

  # ===========================================================================
  # Redis 7 — cache only, and fail-open (see CacheConfig).
  #
  # No password, because application.yml's dev default is an empty REDIS_PASSWORD.
  # Production uses a managed Redis over TLS with a token; see README.md.
  # ===========================================================================
  redis:
    image: redis:7.4-alpine
    container_name: pgm-dev-redis
    restart: unless-stopped

    ports:
      - "127.0.0.1:${REDIS_PORT:-6379}:6379"

    volumes:
      - redisdata:/data

    healthcheck:
      test: ["CMD-SHELL", "redis-cli ping | grep -q PONG || exit 1"]
      interval: 10s
      timeout: 3s
      retries: 5

  # ===========================================================================
  # The API in a container. Behind a profile, because the normal loop is to run it
  # from the IDE (or `./gradlew bootRun`) against the two services above — this is
  # for reproducing the built image locally, i.e. what Koyeb actually deploys.
  #
  #   docker compose --profile app up -d --build
  # ===========================================================================
  api:
    profiles: ["app"]
    build:
      context: ..                       # repository root — the Dockerfile needs backend/
      dockerfile: deployment/Dockerfile
    container_name: pgm-dev-api

    environment:
      # NOT the prod profile: application-prod.yml requires JWT_SECRET and
      # APP_PUBLIC_BASE_URL with no defaults, and turns Flyway's strict validation
      # on. Running the default profile locally keeps this a one-command start.
      SPRING_PROFILES_ACTIVE: ${SPRING_PROFILES_ACTIVE:-default}
      SPRING_DATASOURCE_URL:      jdbc:postgresql://postgres:5432/${POSTGRES_DB:-pg_manager}
      SPRING_DATASOURCE_USERNAME: ${POSTGRES_USER:-postgres}
      SPRING_DATASOURCE_PASSWORD: ${POSTGRES_PASSWORD:-postgres}
      REDIS_HOST: redis
      REDIS_PORT: "6379"
      TZ: ${TZ:-Asia/Kolkata}

    ports:
      - "127.0.0.1:8080:8080"
      # Actuator runs in Spring Boot's management child context on its own port.
      # Published here only so you can curl it; see README.md for why it is separate.
      - "127.0.0.1:9091:9091"

    depends_on:
      postgres:
        condition: service_healthy      # Flyway would fail against a booting database
      redis:
        condition: service_healthy

volumes:
  pgdata:
    name: pgm-dev-pgdata
  redisdata:
    name: pgm-dev-redisdata
