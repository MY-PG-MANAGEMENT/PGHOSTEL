# =============================================================================
# Security response headers.
#
# `always` on every one of these: without it nginx omits the header on error
# responses (4xx/5xx), which is precisely where an XSS payload is most likely to be
# reflected back.
# =============================================================================

# HSTS — 2 years, all subdomains, preload-eligible.
#
# WARNING before enabling `preload`: submitting to the browser preload list is
# effectively irreversible for months, and it locks EVERY subdomain of this domain
# to HTTPS. If any subdomain is HTTP-only, drop `includeSubDomains` first.
# Start with `max-age=300` to verify the certificate chain works, then raise it.
add_header Strict-Transport-Security "max-age=63072000; includeSubDomains; preload" always;

# Block MIME sniffing. Stops a browser deciding an uploaded document is HTML and
# executing it.
add_header X-Content-Type-Options "nosniff" always;

# Legacy clickjacking defence, superseded by frame-ancestors in the CSP below but
# still honoured by older browsers.
add_header X-Frame-Options "DENY" always;

# Do not leak the path or query string of an internal page to third-party sites.
# Query strings here can carry propertyId / partyId.
add_header Referrer-Policy "strict-origin-when-cross-origin" always;

# Surface for browser features this application never uses.
add_header Permissions-Policy "accelerometer=(), autoplay=(), camera=(), display-capture=(), encrypted-media=(), fullscreen=(self), geolocation=(), gyroscope=(), magnetometer=(), microphone=(), midi=(), payment=(), usb=()" always;

# Content Security Policy.
#
# 'unsafe-inline' and 'unsafe-eval' in script-src are NOT sloppiness — a Flutter web
# build compiled to CanvasKit/WASM requires both, and Swagger UI requires inline
# styles. They are the reason this policy is a hardening measure rather than a
# complete XSS defence. If you serve only the JSON API from this host (no Flutter
# web build, Swagger off), tighten to: default-src 'none'; frame-ancestors 'none';
#
# connect-src stays 'self' because the Flutter app talks to this same origin.
add_header Content-Security-Policy "default-src 'self'; base-uri 'self'; form-action 'self'; frame-ancestors 'none'; object-src 'none'; script-src 'self' 'unsafe-inline' 'unsafe-eval' blob:; style-src 'self' 'unsafe-inline'; img-src 'self' data: blob:; font-src 'self' data:; connect-src 'self'; worker-src 'self' blob:; manifest-src 'self'" always;

# Isolate this origin's browsing context group from cross-origin popups.
add_header Cross-Origin-Opener-Policy "same-origin" always;
add_header Cross-Origin-Resource-Policy "same-origin" always;

# X-XSS-Protection is deliberately absent. The header is obsolete, removed from
# Chrome and Edge, and its legacy filter mode introduced vulnerabilities of its own.
# The CSP above replaces it.
