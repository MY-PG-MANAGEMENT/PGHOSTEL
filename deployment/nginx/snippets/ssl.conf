# =============================================================================
# TLS policy — included once at http{} level, inherited by every server block.
#
# Roughly the Mozilla "Intermediate" profile, minus the DHE ciphers. Rated A+ by
# SSL Labs when paired with the HSTS header in security-headers.conf.
# =============================================================================

# TLS 1.2 and 1.3 only. 1.0/1.1 are deprecated (RFC 8996), rejected by PCI DSS, and
# no client this app supports needs them — Flutter's Dart HttpClient and every
# browser released since 2014 speak 1.2 or better.
ssl_protocols TLSv1.2 TLSv1.3;

# Cipher list applies to TLS 1.2 only; TLS 1.3 suites are fixed by the RFC and are
# all safe. Every suite here is ECDHE (forward secrecy) + AEAD (GCM/ChaCha20) —
# no CBC, no RSA key exchange, no DHE.
#
# Omitting DHE is why there is no ssl_dhparam directive and no dhparam.pem to
# generate: a 4096-bit DH parameter file exists only to make DHE suites safe, and
# there are none to make safe.
ssl_ciphers ECDHE-ECDSA-AES128-GCM-SHA256:ECDHE-RSA-AES128-GCM-SHA256:ECDHE-ECDSA-AES256-GCM-SHA384:ECDHE-RSA-AES256-GCM-SHA384:ECDHE-ECDSA-CHACHA20-POLY1305:ECDHE-RSA-CHACHA20-POLY1305;

# Let the client choose. On ARM without AES-NI-equivalent acceleration, ChaCha20 is
# substantially faster than AES-GCM, and mobile clients know their own hardware
# better than a server-side preference order does.
ssl_prefer_server_ciphers off;

# Session resumption. Shared cache across workers; 10m holds ~40,000 sessions.
ssl_session_cache   shared:SSL:10m;
ssl_session_timeout 1d;

# Tickets OFF: nginx does not rotate the ticket key, so a single long-lived key
# undermines forward secrecy for every resumed session. The shared cache above
# already provides resumption.
ssl_session_tickets off;

# OCSP stapling — nginx fetches the revocation response itself and staples it to the
# handshake, so the client does not have to make a separate, privacy-leaking,
# latency-adding call to the CA.
ssl_stapling         on;
ssl_stapling_verify  on;

# Required for stapling to resolve the CA's OCSP responder. Cloudflare + Google
# public resolvers; ipv6=off because the Always Free instance may not have IPv6
# egress configured, and a failed AAAA lookup stalls the fetch.
resolver         1.1.1.1 8.8.8.8 valid=300s ipv6=off;
resolver_timeout 5s;

# Cap the handshake. Defends against a client that opens a connection and dribbles
# the ClientHello one byte at a time.
ssl_handshake_timeout 10s;

# Early data (TLS 1.3 0-RTT) stays OFF. It is replayable by design, and this API has
# non-idempotent POSTs — replaying a payment collection or an invoice generation is
# not a theoretical concern.
ssl_early_data off;
