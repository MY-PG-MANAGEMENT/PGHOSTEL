# =============================================================================
# Shared reverse-proxy settings for every location that talks to Spring Boot.
# =============================================================================

# HTTP/1.1 + an empty Connection header are BOTH required for upstream keepalive to
# work. nginx defaults to HTTP/1.0 towards upstreams and forwards the client's
# `Connection: close`; either one alone silently disables the keepalive pool
# configured in nginx.conf and reintroduces a TCP handshake per request.
#
# $connection_upgrade comes from the map in nginx.conf: empty for ordinary requests
# (so the header is omitted and keepalive works), "upgrade" for a WebSocket
# handshake. Using the map rather than a literal "" means the WebSocket location
# needs no override — and therefore cannot end up with two conflicting
# proxy_set_header directives for the same field.
proxy_http_version 1.1;
proxy_set_header   Connection $connection_upgrade;

# --- Forwarded headers ------------------------------------------------------
# Spring Boot is configured with server.forward-headers-strategy=native, so Tomcat
# reads these to reconstruct the original request. Without X-Forwarded-Proto the app
# believes every request is plain HTTP and any absolute URL it generates comes out
# as http:// — which browsers then block as mixed content.
proxy_set_header Host              $host;
proxy_set_header X-Real-IP         $remote_addr;
proxy_set_header X-Forwarded-For   $proxy_add_x_forwarded_for;
proxy_set_header X-Forwarded-Proto $scheme;
proxy_set_header X-Forwarded-Host  $host;
proxy_set_header X-Forwarded-Port  $server_port;

# Correlation id. Reused if the client sent one, otherwise nginx mints one, so a
# single identifier ties the nginx access log to the api_request_log row for the
# same request.
proxy_set_header X-Request-ID      $request_id;

# Cloudflare's ray id, forwarded so support can match an entry against Cloudflare's
# own logs.
proxy_set_header CF-Ray            $http_cf_ray;

# --- Timeouts ---------------------------------------------------------------
# connect is short: the upstream is a container one hop away on a bridge network,
# so anything beyond 5s means it is down, not slow — fail fast to the next attempt.
proxy_connect_timeout 5s;

# send/read are 120s to cover the genuinely slow endpoints in this API: the bulk CSV
# tenant/facility upload, /billing/generate-invoices, and the report queries that
# aggregate a whole month. The default 60s would cut those off mid-transaction.
proxy_send_timeout    120s;
proxy_read_timeout    120s;

# --- Buffering --------------------------------------------------------------
# On, and sized for JSON. Buffering lets nginx accept the whole upstream response
# quickly, freeing the Tomcat worker thread while nginx dribbles bytes out to a slow
# mobile client. Turning it off ties up a thread in the app for the duration of the
# client's connection — the classic way a mobile API runs out of threads.
proxy_buffering       on;
proxy_buffer_size     16k;      # must hold the response headers, incl. any Set-Cookie
proxy_buffers         8 16k;
proxy_busy_buffers_size 32k;

# Responses larger than the buffers spill to disk. The container rootfs is read-only,
# so point this at the /var/cache/nginx tmpfs.
proxy_temp_path       /var/cache/nginx/proxy_temp;
proxy_max_temp_file_size 128m;

# --- Request body -----------------------------------------------------------
# Do not buffer uploads to disk before forwarding; stream them. Matters for the
# multipart CSV upload endpoints.
proxy_request_buffering off;

# --- Failover ---------------------------------------------------------------
# `non_idempotent` is deliberately NOT included. With a single upstream it would be
# inert, but if a second replica is ever added, retrying a failed POST would risk
# duplicating a payment or an invoice. The billing endpoints accept an
# idempotency_key precisely because retries are the client's decision, not the
# proxy's.
proxy_next_upstream error timeout http_502 http_503 http_504;
proxy_next_upstream_tries   2;
proxy_next_upstream_timeout 10s;

# Let the application own its error responses. Without this, nginx would replace a
# JSON 404 from the API with its own HTML error page and break every client.
proxy_intercept_errors off;

# Strip any upstream header that reveals the stack.
proxy_hide_header X-Powered-By;
proxy_hide_header Server;
