# =============================================================================
# Cloudflare — restore the real client IP.
#
# Every request arriving from Cloudflare's proxy has the edge node's address as its
# source. Without this file:
#   * rate limiting buckets all traffic into ~15 Cloudflare IPs, so one abusive
#     client throttles every other user sharing that edge node
#   * access logs record Cloudflare, making abuse investigation impossible
#   * X-Forwarded-For passed to Spring Boot is the proxy's, not the user's
#
# `set_real_ip_from` is a TRUST list. Only addresses listed here are allowed to
# assert a client IP via CF-Connecting-IP — otherwise anyone could spoof the header
# and evade the rate limits below it.
#
# ---------------------------------------------------------------------------
# MAINTENANCE: these ranges change. Refresh with
#     curl -s https://www.cloudflare.com/ips-v4 | sed 's/^/set_real_ip_from /; s/$/;/'
#     curl -s https://www.cloudflare.com/ips-v6 | sed 's/^/set_real_ip_from /; s/$/;/'
# and reload nginx. scripts/deploy.sh does NOT do this automatically — a stale list
# fails closed (real IP simply not restored), never open.
#
# NOT USING CLOUDFLARE PROXY (grey cloud / DNS-only)? Delete every set_real_ip_from
# line and the real_ip_header line, or leave the file as-is: with no matching source
# the directives are inert and $remote_addr stays correct.
# ---------------------------------------------------------------------------
# Last refreshed: 2026-07-26
# =============================================================================

# --- Cloudflare IPv4 --------------------------------------------------------
set_real_ip_from 173.245.48.0/20;
set_real_ip_from 103.21.244.0/22;
set_real_ip_from 103.22.200.0/22;
set_real_ip_from 103.31.4.0/22;
set_real_ip_from 141.101.64.0/18;
set_real_ip_from 108.162.192.0/18;
set_real_ip_from 190.93.240.0/20;
set_real_ip_from 188.114.96.0/20;
set_real_ip_from 197.234.240.0/22;
set_real_ip_from 198.41.128.0/17;
set_real_ip_from 162.158.0.0/15;
set_real_ip_from 104.16.0.0/13;
set_real_ip_from 104.24.0.0/14;
set_real_ip_from 172.64.0.0/13;
set_real_ip_from 131.0.72.0/22;

# --- Cloudflare IPv6 --------------------------------------------------------
set_real_ip_from 2400:cb00::/32;
set_real_ip_from 2606:4700::/32;
set_real_ip_from 2803:f800::/32;
set_real_ip_from 2405:b500::/32;
set_real_ip_from 2405:8100::/32;
set_real_ip_from 2a06:98c0::/29;
set_real_ip_from 2c0f:f248::/32;

# --- Docker bridge networks -------------------------------------------------
# So a container-to-container request (the nginx healthcheck, an internal probe)
# is not mistaken for an untrusted external source.
set_real_ip_from 172.16.0.0/12;
set_real_ip_from 10.0.0.0/8;
set_real_ip_from 127.0.0.1/32;

# CF-Connecting-IP always holds exactly one address — the true client. Preferred over
# X-Forwarded-For, which is a comma-separated list an attacker can prepend entries to.
real_ip_header CF-Connecting-IP;

# Off, because CF-Connecting-IP is a single value with no chain to walk. Turning it
# on with this header is a misconfiguration.
real_ip_recursive off;
