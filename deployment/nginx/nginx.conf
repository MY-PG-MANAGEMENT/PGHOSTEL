# =============================================================================
# nginx main configuration — PG Manager production edge
#
# Mounted read-only at /etc/nginx/nginx.conf.
# Virtual hosts live in conf.d/*.template and are rendered by the image's envsubst
# entrypoint into /etc/nginx/conf.d/ (a tmpfs, because the container rootfs is read-only).
# =============================================================================

user  nginx;

# One worker per core. On the Ampere A1 shape that is 4.
worker_processes  auto;

# Must not exceed the container's nofile limit.
worker_rlimit_nofile 65535;

error_log  /var/log/nginx/error.log warn;
pid        /var/run/nginx.pid;

events {
    # Ceiling of worker_processes * worker_connections concurrent connections.
    # 4 * 4096 = 16k, comfortably above what this stack will see.
    worker_connections  4096;

    # Accept as many new connections as possible per event loop pass rather than one.
    multi_accept        on;

    use                 epoll;
}

http {
    # -------------------------------------------------------------------------
    # Basics
    # -------------------------------------------------------------------------
    include       /etc/nginx/mime.types;
    default_type  application/octet-stream;

    # Suppress the version in the Server header and on error pages. It does not stop
    # a determined attacker, but it does remove you from the results of mass scans
    # searching for one specific vulnerable version.
    server_tokens off;

    charset       utf-8;
    charset_types text/plain text/css application/json application/javascript
                  text/xml application/xml application/xml+rss text/javascript;

    # -------------------------------------------------------------------------
    # Logging
    #
    # `main` carries the upstream timings, which are what you actually need when
    # someone reports "the app is slow": request_time is total wall clock as seen by
    # the client, upstream_response_time is how much of that was the Spring Boot app.
    # A large gap between them is a network/buffering problem, not an application one.
    # -------------------------------------------------------------------------
    log_format main '$remote_addr - $remote_user [$time_local] "$request" '
                    '$status $body_bytes_sent "$http_referer" '
                    '"$http_user_agent" "$http_x_forwarded_for" '
                    'rt=$request_time uct="$upstream_connect_time" '
                    'uht="$upstream_header_time" urt="$upstream_response_time" '
                    'cf_ray="$http_cf_ray" host="$host"';

    # JSON variant — switch the access_log directive below to this if you ever ship
    # logs to Loki/Elasticsearch. Kept here so the field list stays in one file.
    log_format json escape=json
        '{"time":"$time_iso8601","remote_addr":"$remote_addr","method":"$request_method",'
        '"uri":"$uri","status":$status,"bytes":$body_bytes_sent,'
        '"referer":"$http_referer","ua":"$http_user_agent",'
        '"request_time":$request_time,"upstream_time":"$upstream_response_time",'
        '"cf_ray":"$http_cf_ray","host":"$host"}';

    access_log /var/log/nginx/access.log main buffer=32k flush=5s;

    # -------------------------------------------------------------------------
    # Transfer tuning
    # -------------------------------------------------------------------------
    sendfile        on;

    # Send response headers in the same packet as the start of the body, and hold
    # partial packets until full. Only correct when paired with sendfile.
    tcp_nopush      on;

    # ...but disable Nagle on the last packet, so a small JSON response is not
    # delayed by up to 200ms waiting for more data that is never coming. This matters
    # for a JSON API far more than it does for a static site.
    tcp_nodelay     on;

    # -------------------------------------------------------------------------
    # Keep-alive
    #
    # Client-side 65s is deliberately just above the 60s most load balancers and
    # Cloudflare use, so nginx is not the side that closes first (a race that shows
    # up to users as sporadic 502s).
    # -------------------------------------------------------------------------
    keepalive_timeout   65s;
    keepalive_requests  1000;

    reset_timedout_connection on;

    # -------------------------------------------------------------------------
    # Request limits
    #
    # 25m covers the largest thing this API accepts: a bulk CSV upload of tenants or
    # facilities via /api/super-admin/upload/*. Raise both together if those grow.
    # -------------------------------------------------------------------------
    client_max_body_size        25m;
    client_body_buffer_size     256k;
    client_header_buffer_size   4k;
    large_client_header_buffers 4 16k;      # JWTs make headers big

    client_body_timeout   30s;
    client_header_timeout 15s;
    send_timeout          60s;

    # -------------------------------------------------------------------------
    # Real client IP
    #
    # MUST be loaded before the rate-limit zones below are evaluated. Behind
    # Cloudflare every connection arrives from a Cloudflare edge IP, so without this
    # $binary_remote_addr is the *proxy's* address: all traffic collapses into a
    # handful of buckets, rate limiting throttles legitimate users in blocks, and
    # every access log line is useless for abuse investigation.
    # -------------------------------------------------------------------------
    include /etc/nginx/snippets/cloudflare-realip.conf;

    # -------------------------------------------------------------------------
    # Rate limiting
    #
    # Zone memory: ~16,000 IPs per megabyte. 10m therefore tracks ~160k distinct
    # addresses, which is far more than this workload needs.
    #
    # Three tiers because the endpoints differ in cost and in what abuse looks like:
    #   api   — normal authenticated traffic. Generous; the app is the bottleneck.
    #   auth  — login / refresh / forgot-password. Credential stuffing lives here, and
    #           each attempt costs a BCrypt hash (intentionally ~100ms of CPU), so an
    #           unthrottled attacker saturates the API's cores with 10 threads.
    #   pub   — /api/public/** self check-in. Unauthenticated and it CREATES tenant
    #           rows, so it is the only write path a stranger can reach.
    # -------------------------------------------------------------------------
    limit_req_zone $binary_remote_addr zone=api_zone:10m  rate=30r/s;
    limit_req_zone $binary_remote_addr zone=auth_zone:10m rate=12r/m;
    limit_req_zone $binary_remote_addr zone=pub_zone:10m  rate=20r/m;

    # Concurrent connections per IP. Blunts slowloris and one client opening hundreds
    # of parallel requests.
    limit_conn_zone $binary_remote_addr zone=conn_zone:10m;

    # 429 rather than the default 503: 503 tells a client (and Cloudflare) the origin
    # is broken, 429 correctly says "you are going too fast" and is retriable.
    limit_req_status  429;
    limit_conn_status 429;
    limit_req_log_level warn;

    # -------------------------------------------------------------------------
    # Compression
    #
    # JSON API responses compress by roughly 80%. gzip_comp_level 5 is the knee of
    # the curve — 9 costs several times the CPU for ~2% more saving.
    # -------------------------------------------------------------------------
    gzip              on;
    gzip_vary         on;               # correct caching for clients that do not accept gzip
    gzip_proxied      any;
    gzip_comp_level   5;
    gzip_min_length   1024;             # below this the header overhead exceeds the saving
    gzip_disable      "msie6";
    gzip_types
        application/json
        application/javascript
        application/x-javascript
        application/xml
        application/xml+rss
        application/rss+xml
        application/atom+xml
        application/vnd.api+json
        application/wasm
        font/ttf
        font/otf
        image/svg+xml
        text/css
        text/javascript
        text/plain
        text/xml;
    # NOT compressed on purpose: images (already compressed) and PDFs. The report PDFs
    # this app generates are served as a download; gzipping them wastes CPU.

    # -------------------------------------------------------------------------
    # Connection header for the upstream.
    #
    # One map instead of two competing `proxy_set_header Connection` directives.
    # This matters: nginx does NOT overwrite a repeated proxy_set_header for the same
    # field, so a location that included the keepalive setting (`Connection ""`) and
    # then set `Connection "upgrade"` for WebSockets would produce two conflicting
    # directives for one header. The map resolves it in one place:
    #
    #   normal request  -> "" -> nginx omits the header entirely, which is exactly
    #                            what the upstream keepalive pool below requires
    #   Upgrade request -> "upgrade" -> the WebSocket handshake is forwarded intact
    # -------------------------------------------------------------------------
    map $http_upgrade $connection_upgrade {
        default upgrade;
        ''      '';
    }

    # -------------------------------------------------------------------------
    # Upstream
    #
    # `keepalive` holds idle connections open to Spring Boot. Without it every single
    # proxied request pays a fresh TCP handshake to the API container. The paired
    # proxy_http_version 1.1 + the empty Connection header from the map above is
    # mandatory for it to work — HTTP/1.0 has no persistent connections.
    # -------------------------------------------------------------------------
    upstream pgmanager_api {
        server api:8080 max_fails=3 fail_timeout=15s;

        keepalive               64;
        keepalive_requests      1000;
        keepalive_timeout       60s;
    }

    # Actuator, internal only. Used by the /health probe endpoint. Never expose the
    # rest of this port publicly — the management context sits outside the app's
    # Spring Security filter chain.
    upstream pgmanager_actuator {
        server api:9091 max_fails=3 fail_timeout=15s;
        keepalive 8;
    }

    # -------------------------------------------------------------------------
    # SSL settings shared by every server block
    # -------------------------------------------------------------------------
    include /etc/nginx/snippets/ssl.conf;

    # -------------------------------------------------------------------------
    # Virtual hosts (rendered from /etc/nginx/templates/*.template at container start)
    # -------------------------------------------------------------------------
    include /etc/nginx/conf.d/*.conf;
}
