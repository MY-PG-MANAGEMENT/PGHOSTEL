<!doctype html>
<!--
  Placeholder document root.

  Replace the contents of this directory with the Flutter web build when you want
  nginx to serve the owner app from the same origin as the API:

      cd owner_app
      flutter build web --release --dart-define=API_BASE_URL=https://<your-domain>/api
      rsync -av --delete build/web/ <host>:/opt/pgmanager/deployment/nginx/www/

  If this host only ever serves the JSON API, leave this file in place — it stops
  the document root being empty (which nginx answers with a 403, not a 404).
-->
<html lang="en">
<head>
  <meta charset="utf-8">
  <meta name="viewport" content="width=device-width, initial-scale=1">
  <meta name="robots" content="noindex, nofollow">
  <title>PG Manager</title>
  <style>
    :root { color-scheme: light dark; }
    body {
      margin: 0; min-height: 100vh;
      display: grid; place-items: center;
      font: 16px/1.6 system-ui, -apple-system, "Segoe UI", Roboto, sans-serif;
      background: #fafafa; color: #1a1a1a;
    }
    @media (prefers-color-scheme: dark) {
      body { background: #121212; color: #e8e8e8; }
      code { background: #262626 !important; }
    }
    main { text-align: center; padding: 2rem; }
    h1 { font-size: 1.25rem; font-weight: 600; margin: 0 0 .5rem; }
    p  { margin: .25rem 0; opacity: .7; font-size: .9rem; }
    code { background: #ececec; padding: .15rem .4rem; border-radius: 4px; font-size: .85em; }
  </style>
</head>
<body>
  <main>
    <h1>PG Manager</h1>
    <p>API is running.</p>
    <p>Health: <code>/health</code></p>
  </main>
</body>
</html>
