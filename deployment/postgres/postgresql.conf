# =============================================================================
# PostgreSQL 17 — production configuration for PG Manager
#
# Mounted read-only at /etc/postgresql/postgresql.conf and loaded via
#   postgres -c config_file=/etc/postgresql/postgresql.conf
#
# Unlike MySQL's --defaults-file, this does NOT replace built-in defaults: anything
# omitted here keeps its compiled-in value. So this file is only the settings that
# actually need to differ, not a full copy of the shipped configuration.
#
# Sized for a container limited to 6 GB (see docker-compose.yml). If you change that
# limit, change shared_buffers and effective_cache_size with it — PostgreSQL will
# happily plan for memory the cgroup will not give it and get OOM-killed.
#
# NOTE: the file must live OUTSIDE the data directory. The entrypoint writes its own
# postgresql.conf into PGDATA during initdb, and a read-only mount there aborts
# initialisation.
# =============================================================================

# -----------------------------------------------------------------------------
# Connections
#
# 200 backends. Budget: 30 per API replica (DB_POOL_MAX), plus the healthcheck, plus
# pg_dump during a backup, plus your own psql sessions.
#
# This ceiling matters far more than MySQL's max_connections did. PostgreSQL forks a
# separate OS PROCESS per connection (MySQL used a thread), so each idle connection
# costs several MB of private memory plus its share of work_mem during a query. An
# oversized max_connections here is not slack — it is a way to run the box out of RAM.
# The real limiter is the pool size; this is the backstop.
# -----------------------------------------------------------------------------
listen_addresses = '*'          # container-internal only; not published to the host
port = 5432
max_connections = 200

# Reserved for the superuser so an exhausted pool still leaves you a way in to fix it.
superuser_reserved_connections = 5

# -----------------------------------------------------------------------------
# Memory — the settings that actually matter
# -----------------------------------------------------------------------------

# The shared page cache. Standard guidance is 25% of available RAM, and unlike MySQL's
# innodb_buffer_pool_size it is NOT meant to hold the whole working set: PostgreSQL
# deliberately leans on the OS page cache as a second tier, so pushing this to 60-70%
# (correct for InnoDB) causes double-buffering and makes things worse.
shared_buffers = 1536MB                 # 25% of the 6G container limit

# Not an allocation — a hint to the planner about how much data is cached in total
# (shared_buffers + the OS page cache). Too low and it avoids index scans that would
# actually be cheap. ~65% of the container limit.
effective_cache_size = 4GB

# Per sort/hash NODE, not per query or per connection: one complex query can use
# several at once. 200 connections x several nodes is why this stays modest. The
# reporting and dashboard queries GROUP BY over a month of invoices, which fits.
work_mem = 16MB

# For VACUUM, CREATE INDEX and ALTER TABLE — few run at once, so it can be generous.
# This is what makes a Flyway index build on api_request_log finish in reasonable time.
maintenance_work_mem = 512MB

# Ceiling across all concurrent autovacuum workers, so they cannot collectively
# allocate 3 x maintenance_work_mem during a busy period.
autovacuum_work_mem = 256MB

# -----------------------------------------------------------------------------
# Write-ahead log and durability
# -----------------------------------------------------------------------------

# on = fsync the WAL at every commit. This is the ACID-compliant setting and the only
# defensible one for an application that records rent payments: `off` can lose the
# last second of committed transactions on host power loss, and `local` is not enough
# either. It costs write throughput. Pay it.
synchronous_commit = on
fsync = on
full_page_writes = on

# `replica` (the default) rather than `minimal`: it is the prerequisite for both
# point-in-time recovery and adding a read replica later, and costs little at this
# write volume. It is the equivalent of keeping MySQL's binlog on.
wal_level = replica

# Checkpoint tuning. max_wal_size is the PostgreSQL analogue of
# innodb_redo_log_capacity: larger means fewer, bigger checkpoint flushes — better
# write throughput at the cost of longer crash recovery.
max_wal_size = 2GB
min_wal_size = 512MB

# Spread the checkpoint's writes across 90% of the interval instead of dumping them
# in a burst. Without this, every checkpoint is a visible latency spike on the API.
checkpoint_completion_target = 0.9
checkpoint_timeout = 15min

# Retain some WAL for a future replica or for PITR alongside the nightly dump.
# Keep this in step with the retention you actually want; unbounded WAL fills the boot
# volume, which is the classic way a small cloud VM dies at 3am.
wal_keep_size = 1GB

# Compress full-page images. Meaningfully smaller WAL on wide tables —
# api_request_log has 32 columns and is the highest-insert-rate table in the schema.
wal_compression = on

# -----------------------------------------------------------------------------
# Planner / storage I/O
#
# Tuned for the block volume on an Oracle Cloud Always Free instance, which is
# network-attached and not a local NVMe SSD.
# -----------------------------------------------------------------------------

# 1.1, not the default 4.0: even network-attached block storage is far closer to an
# SSD than to the spinning disk the default assumes. Leaving it at 4.0 makes the
# planner avoid index scans and pick sequential scans that are genuinely slower here.
random_page_cost = 1.1

# How many concurrent I/Os the storage can service. Modest, because this is network
# storage rather than a local SSD array.
effective_io_concurrency = 200

# Parallelism, sized for the 2.0 CPU limit in docker-compose.yml. Allowing more
# workers than the cgroup has CPU just adds context switching.
max_worker_processes = 4
max_parallel_workers = 4
max_parallel_workers_per_gather = 2
max_parallel_maintenance_workers = 2

# -----------------------------------------------------------------------------
# Autovacuum
#
# This has no MySQL equivalent and it is not optional. PostgreSQL's MVCC leaves a dead
# tuple behind on every UPDATE and DELETE; autovacuum is what reclaims them. The
# api_request_log retention sweep deletes in large batches every night, so that table
# in particular would bloat without vacuuming more aggressively than the defaults.
# -----------------------------------------------------------------------------
autovacuum = on
autovacuum_max_workers = 3
autovacuum_naptime = 30s

# More aggressive than the 0.2/0.1 defaults: vacuum/analyse after 5%/2% of a table
# changes rather than 20%/10%. On the large, high-churn tables (api_request_log,
# invoice, payment) the default lets far too much bloat accumulate between runs.
autovacuum_vacuum_scale_factor = 0.05
autovacuum_analyze_scale_factor = 0.02

# Cost limit raised from the default 200 so a vacuum on a big table actually finishes
# rather than being throttled into never catching up with the write rate.
autovacuum_vacuum_cost_limit = 1000
autovacuum_vacuum_cost_delay = 2ms

# -----------------------------------------------------------------------------
# Statement and session timeouts
# -----------------------------------------------------------------------------

# Fail a blocked statement in 30s rather than letting a lock pile-up exhaust the
# connection pool. Matches the old innodb_lock_wait_timeout.
lock_timeout = 30s

# The one with no MySQL analogue and the most operational value: kill a transaction
# left open and idle for a minute. An idle-in-transaction session holds its locks AND
# blocks vacuum from reclaiming any tuple newer than it — one forgotten transaction
# can bloat the whole database. 60s is far longer than any legitimate request.
idle_in_transaction_session_timeout = 60s

# Close a fully idle session after 10 minutes. MUST EXCEED HikariCP's max-lifetime
# (540s in application-prod.yml). Getting this backwards is the classic cause of
# intermittent "connection has been closed" errors — the server drops a pooled
# connection Hikari still believes is good, and the next query on it fails.
idle_session_timeout = 600s

# No global statement_timeout. A blanket cap would kill the CSV bulk import and the
# nightly invoice sweep, which are legitimately long. Set it per session if needed.
statement_timeout = 0

# -----------------------------------------------------------------------------
# Logging
#
# Written to the host-mounted ./logs/postgres so it survives the container, and ALSO
# to stderr so `docker compose logs postgres` still works — that is the first thing
# you reach for when the container will not start, and at that point there is no
# container left to exec into and read a file from.
# -----------------------------------------------------------------------------
logging_collector = on
log_destination = 'stderr'
log_directory = '/var/log/postgresql'
log_filename = 'postgresql-%Y-%m-%d.log'
log_rotation_age = 1d
log_rotation_size = 50MB
log_truncate_on_rotation = on

# 14 files x 1 day. Bounded so the log directory cannot fill the boot volume.
log_file_mode = 0640

# The slow query log. 1 second: any API query slower than this is a user-visible
# stall worth reading. This replaces MySQL's slow_query_log + long_query_time.
log_min_duration_statement = 1000

# Statements are NOT logged wholesale (log_statement = 'none', the default). At INFO-
# level statement logging this schema would write tenant mobile numbers and payment
# amounts to disk in plain text. Only DDL is worth recording.
log_statement = 'ddl'

log_checkpoints = on
log_connections = off           # one line per connection is pure noise with a pool
log_disconnections = off
log_lock_waits = on             # a lock wait in a multi-tenant app is usually a real bug
log_autovacuum_min_duration = 1000
log_temp_files = 0              # any spill to a temp file means work_mem was too small

log_line_prefix = '%m [%p] %q%u@%d '
log_timezone = 'Asia/Kolkata'

# -----------------------------------------------------------------------------
# Statistics
#
# pg_stat_statements is the single most useful thing on this list during an incident —
# it is how you answer "what is the database actually spending its time on". The
# extension itself still has to be CREATEd in the database; see postgres/init.
# -----------------------------------------------------------------------------
shared_preload_libraries = 'pg_stat_statements'
pg_stat_statements.max = 5000
pg_stat_statements.track = top
track_activities = on
track_counts = on                # required by autovacuum; never turn this off
track_io_timing = on

# -----------------------------------------------------------------------------
# Locale and timezone
#
# +05:30 must match TZ in .env. The app's schedulers are wall-clock based (invoices at
# 01:00, bed transfers at 00:05, rent reminders at 09:00), and every created_at is a
# `timestamp without time zone` written from the JVM — a mismatch between the JVM's
# zone and the database's shifts every generated due date by the difference.
#
# Unlike MySQL, a NAMED zone is fine here: PostgreSQL ships its own timezone database,
# so it needs no equivalent of mysql_tzinfo_to_sql.
# -----------------------------------------------------------------------------
timezone = 'Asia/Kolkata'
datestyle = 'iso, mdy'
lc_messages = 'C'               # keep server errors greppable in English
default_text_search_config = 'pg_catalog.english'

# -----------------------------------------------------------------------------
# Character encoding
#
# Deliberately absent, because it is not a runtime setting: encoding is fixed at
# initdb time and the official image already uses UTF-8. That is what free-form
# Indian-language tenant names, complaint bodies and notice text need. There is no
# utf8-vs-utf8mb4 trap to avoid here — PostgreSQL's UTF8 has always been full UTF-8.
# -----------------------------------------------------------------------------
