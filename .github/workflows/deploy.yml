# =============================================================================
# CI/CD — test, then trigger a Koyeb deploy
#
#   push to main   -> test, then tell Koyeb to redeploy
#   pull request   -> test only (never deploys)
#   manual         -> workflow_dispatch, with an option to skip tests for a hotfix
#
# ---------------------------------------------------------------------------
# ARCHITECTURE
#
#   GitHub ──push──> Koyeb (builds the image from deployment/Dockerfile and runs it)
#                      │
#                      │ JDBC / RESP over TLS
#                      ▼
#                    Managed PostgreSQL   +   Managed Redis
#
# Koyeb builds the image itself from the repository, so this workflow does NOT build
# or publish one. That is a deliberate simplification over the setup it replaced,
# which cross-compiled a linux/arm64 image under QEMU (3-5x slower) and pushed it to
# GHCR for an Oracle Cloud box to pull.
#
# What this workflow is still for: Koyeb's GitHub integration deploys on push
# WITHOUT running the test suite. Gating the deploy behind `needs: [test]` here is
# the only thing standing between a red build and production.
#
#   ==> Turn OFF auto-deploy in the Koyeb service's GitHub settings, or this gate is
#       bypassed — Koyeb would start building the moment you push, in parallel with
#       the tests, and the redeploy below would merely be a second deploy of the same
#       commit.
#
# ---------------------------------------------------------------------------
# REQUIRED REPOSITORY SECRETS  (Settings -> Secrets and variables -> Actions)
#
#   KOYEB_API_TOKEN    a Koyeb API token (Koyeb dashboard -> Account -> API)
#
# REQUIRED REPOSITORY VARIABLES (Settings -> Secrets and variables -> Variables)
#
#   KOYEB_SERVICE      the service to redeploy, as `app-name/service-name`
#
# Application secrets (SPRING_DATASOURCE_URL, JWT_SECRET, ...) are NOT here. They
# live in the Koyeb service's environment variables and nowhere else — see
# deployment/README.md.
# ---------------------------------------------------------------------------
# =============================================================================

name: Test and Deploy

on:
  push:
    branches: [main]
    paths-ignore:
      # Documentation changes must not trigger a deploy.
      - '**.md'
      - 'docs/**'
      - 'owner_app/**'          # the Flutter app ships separately
  pull_request:
    branches: [main]
  workflow_dispatch:
    inputs:
      skip_tests:
        description: 'Skip tests (emergency hotfix only)'
        type: boolean
        default: false

# Serialise deploys. Two concurrent runs would race on the same Koyeb service.
#
# cancel-in-progress is FALSE on purpose: cancelling mid-deploy is worse than
# queueing behind it — it can abort between triggering the redeploy and confirming
# the rollout went healthy, leaving nobody watching it.
concurrency:
  group: production-deploy
  cancel-in-progress: false

permissions:
  contents: read

jobs:

  # ===========================================================================
  # 1. Test
  #
  # The runner has a Docker daemon, so the Testcontainers integration tests
  # actually execute here — unlike a local machine without Docker, where
  # TEST_PLAN.md notes they auto-skip. This is often the only place they run, which
  # is exactly why the deploy depends on it.
  # ===========================================================================
  test:
    name: Test
    runs-on: ubuntu-24.04
    if: ${{ !inputs.skip_tests }}
    timeout-minutes: 30

    steps:
      - uses: actions/checkout@v4

      - name: Set up JDK 21
        uses: actions/setup-java@v4
        with:
          distribution: temurin
          java-version: '21'

      - name: Set up Gradle
        uses: gradle/actions/setup-gradle@v4
        with:
          # Only write the dependency cache from the default branch, so a PR cannot
          # poison the cache every later build reads.
          cache-read-only: ${{ github.ref != 'refs/heads/main' }}

      - name: Run tests
        working-directory: backend
        run: ./gradlew test --no-daemon --stacktrace

      - name: Publish test report
        # `always()`: a failing build is precisely when the report is needed.
        if: always()
        uses: actions/upload-artifact@v4
        with:
          name: test-results
          path: |
            backend/build/reports/tests/
            backend/build/test-results/
          retention-days: 14

  # ===========================================================================
  # 2. Deploy
  #
  # Triggers a redeploy of the Koyeb service and waits for it to go healthy. Koyeb
  # performs the rollout: it starts the new instance, waits for the health check on
  # port 9091 (/actuator/health/readiness — which includes the database, so a failed
  # Flyway migration fails the deploy), and only then shifts traffic. A failed health
  # check leaves the previous version serving.
  # ===========================================================================
  deploy:
    name: Deploy to Koyeb
    runs-on: ubuntu-24.04
    needs: [test]
    # `always()` with the explicit result checks lets this run when the test job was
    # SKIPPED (the hotfix path) but not when it FAILED.
    if: |
      always() &&
      github.event_name == 'push' &&
      github.ref == 'refs/heads/main' &&
      (needs.test.result == 'success' || needs.test.result == 'skipped')
    timeout-minutes: 30

    steps:
      - name: Install the Koyeb CLI
        run: |
          curl -fsSL https://raw.githubusercontent.com/koyeb/koyeb-cli/master/install.sh | sh
          echo "$HOME/.koyeb/bin" >> "$GITHUB_PATH"

      - name: Redeploy
        env:
          KOYEB_TOKEN: ${{ secrets.KOYEB_API_TOKEN }}
          SERVICE: ${{ vars.KOYEB_SERVICE }}
        run: |
          set -euo pipefail
          if [ -z "${SERVICE:-}" ]; then
            echo "::error::KOYEB_SERVICE repository variable is not set (expected app-name/service-name)"
            exit 1
          fi
          koyeb service redeploy "$SERVICE" --token "$KOYEB_TOKEN"

      - name: Wait for the rollout to go healthy
        env:
          KOYEB_TOKEN: ${{ secrets.KOYEB_API_TOKEN }}
          SERVICE: ${{ vars.KOYEB_SERVICE }}
        run: |
          set -euo pipefail
          # Poll rather than trusting the redeploy call. `koyeb service redeploy`
          # returns as soon as the deployment is ACCEPTED, not when it is serving, so
          # a workflow that goes green there reports success for a deploy that may
          # still be about to fail its health check and roll back — the one outcome
          # you most need CI to show you.
          for i in $(seq 1 60); do
            STATUS=$(koyeb service get "$SERVICE" --token "$KOYEB_TOKEN" -o json 2>/dev/null \
                     | tr ',' '\n' | grep -m1 '"status"' | cut -d'"' -f4 || echo "UNKNOWN")
            echo "[$i/60] service status: $STATUS"
            case "$STATUS" in
              HEALTHY)
                echo "Deploy healthy."
                exit 0 ;;
              ERROR|UNHEALTHY|DEGRADED)
                echo "::error::Deploy failed with status $STATUS. The previous version should still be serving — confirm in the Koyeb dashboard."
                exit 1 ;;
            esac
            sleep 15
          done
          echo "::error::Timed out after 15 minutes waiting for the service to become healthy."
          exit 1

      - name: Report failure
        if: failure()
        run: |
          {
            echo "### Deploy failed"
            echo ""
            echo "Commit: \`${{ github.sha }}\`"
            echo ""
            echo "Koyeb only shifts traffic once the new instance passes its health"
            echo "check, so the previous version is most likely still serving."
            echo "Confirm in the Koyeb dashboard, or:"
            echo ""
            echo '```'
            echo "koyeb service get ${{ vars.KOYEB_SERVICE }}"
            echo "koyeb service logs ${{ vars.KOYEB_SERVICE }}"
            echo '```'
            echo ""
            echo "Most common causes, in order:"
            echo "1. A missing environment variable. \`application-prod.yml\` declares"
            echo "   SPRING_DATASOURCE_URL, JWT_SECRET and APP_PUBLIC_BASE_URL with no"
            echo "   default, so the context fails at startup rather than quietly"
            echo "   running on a development value."
            echo "2. The health check is not pointed at port 9091. On 8080 it hits"
            echo "   SecurityConfig's \`anyRequest().authenticated()\` and returns 401,"
            echo "   so it can never pass."
            echo "3. A failed Flyway migration — readiness includes the database."
            echo ""
            echo "If the release included a migration, note that migrations are"
            echo "forward-only: redeploying an older image may fail schema validation."
            echo "Rolling forward with a fix is usually better than rolling back."
          } >> "$GITHUB_STEP_SUMMARY"
