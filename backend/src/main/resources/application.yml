server:
  port: 8080

spring:
  application:
    name: pg-manager-backend
  datasource:
    url: jdbc:mysql://localhost:3306/pg_manager?createDatabaseIfNotExist=true&useSSL=false&allowPublicKeyRetrieval=true&serverTimezone=Asia/Kolkata
    username: root
    password: root
  jpa:
    hibernate:
      ddl-auto: validate
    open-in-view: false
    properties:
      hibernate:
        format_sql: true
  # Redis connection for the cache layer. Only actually contacted when
  # app.cache.enabled=true; the app boots fine without Redis when caching is off.
  data:
    redis:
      host: ${REDIS_HOST:localhost}
      port: ${REDIS_PORT:6379}
      password: ${REDIS_PASSWORD:}
      timeout: 2000ms
      connect-timeout: 2000ms
  flyway:
    enabled: true
    locations: classpath:db/migration
    validate-on-migrate: false
  # SMTP transport for outbound tenant emails. Leave MAIL_HOST unset to disable
  # sending (the app still boots; outbox rows stay queued until configured).
  mail:
    host: ${MAIL_HOST:}
    port: ${MAIL_PORT:587}
    username: ${MAIL_USERNAME:}
    password: ${MAIL_PASSWORD:}
    properties:
      mail:
        smtp:
          auth: true
          starttls:
            enable: true

app:
  # Redis-backed caching. Default OFF so existing/dev setups without a Redis
  # server keep booting unchanged. Turn on (with Redis reachable) in prod:
  #   CACHE_ENABLED=true REDIS_HOST=... REDIS_PORT=... REDIS_PASSWORD=...
  # When on, cache failures degrade gracefully to direct DB reads (see CacheConfig).
  cache:
    enabled: ${CACHE_ENABLED:true}
  # Base URL the tenant self check-in QR points to. Must be reachable from the
  # tenant's phone (a LAN IP for local testing, or your public domain in prod).
  public-base-url: ${APP_PUBLIC_BASE_URL:http://192.168.1.25:8080}
  messaging:
    email:
      # Turn on to actually dispatch queued tenant emails. Requires spring.mail.* above.
      enabled: ${EMAIL_ENABLED:false}
      from: ${EMAIL_FROM:no-reply@pgmanager.app}
      from-name: ${EMAIL_FROM_NAME:PG Manager}
  security:
    jwt-secret: change-this-development-secret-change-before-production-123456789
    access-token-minutes: 30
    refresh-token-days: 14

logging:
  # Centralised API request/response logging (com.pgmanager.apilog).
  # Every hit is persisted to api_request_log — no sampling, no path exclusions — and rows are
  # purged after retention-days by ApiLogCleanupScheduler.
  api:
    enabled: ${API_LOG_ENABLED:true}
    store-request-body: ${API_LOG_STORE_REQUEST_BODY:true}
    store-response-body: ${API_LOG_STORE_RESPONSE_BODY:true}
    # Leave on. Off means raw passwords/tokens land in the database in plain text.
    mask-sensitive-data: ${API_LOG_MASK:true}
    # Persist off the request thread. false makes the insert inline (handy in tests).
    async: ${API_LOG_ASYNC:true}
    retention-days: ${API_LOG_RETENTION_DAYS:10}
    # Per-payload cap in characters, applied after masking. Keep <= ~16000 for TEXT columns.
    max-payload-chars: ${API_LOG_MAX_PAYLOAD_CHARS:8000}
    # Off-peak, and clear of the 01:00 invoice sweep and 00:05 bed-transfer job.
    cleanup-cron: ${API_LOG_CLEANUP_CRON:0 15 3 * * *}
    cleanup-batch-size: ${API_LOG_CLEANUP_BATCH_SIZE:5000}
    cleanup-max-batches-per-run: ${API_LOG_CLEANUP_MAX_BATCHES:200}
    executor:
      core-size: ${API_LOG_EXECUTOR_CORE:2}
      max-size: ${API_LOG_EXECUTOR_MAX:8}
      # Bounded on purpose: overflow falls back to the caller (backpressure) rather than
      # discarding rows or growing until the heap dies. See ApiLogAsyncConfig.
      queue-capacity: ${API_LOG_EXECUTOR_QUEUE:10000}
      await-termination-seconds: ${API_LOG_EXECUTOR_AWAIT:20}

springdoc:
  swagger-ui:
    path: /swagger-ui.html
