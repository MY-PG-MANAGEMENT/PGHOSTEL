# =============================================================================
# Production profile — activated by SPRING_PROFILES_ACTIVE=prod
#
# Overlays application.yml. Only what must differ in production is repeated here;
# everything else (the logging.api.* block, springdoc paths, JWT lifetimes) is
# inherited unchanged.
#
# Two rules this file follows throughout:
#   1. Secrets are ${PLACEHOLDERS} with NO default. A missing value must fail the
#      context at startup, loudly, rather than fall back to the development value
#      that is committed in application.yml.
#   2. Non-secret tuning gets a default, so the app still boots on a host where an
#      optional variable was not set.
# =============================================================================

server:
  port: ${SERVER_PORT:8080}

  # Stop accepting new connections, let in-flight requests finish, then shut down.
  # Paired with spring.lifecycle.timeout-per-shutdown-phase below, which must stay
  # under the platform's termination grace period — Koyeb sends SIGTERM and then
  # SIGKILLs; a drain longer than its grace period is cut off mid-request.
  shutdown: graceful

  # Trust X-Forwarded-* from Koyeb's edge. Without this Tomcat believes every
  # request arrived over plain HTTP, so any absolute URL the app builds comes out as
  # http://...:8080/ and request.getRemoteAddr() returns the proxy rather than the
  # client — which also means api_request_log records the proxy IP for every hit.
  #
  # Safe because the container is only reachable through Koyeb's load balancer. It
  # would NOT be safe on a service exposed directly to the internet: a client could
  # then forge these headers and spoof both the scheme and its own IP.
  forward-headers-strategy: native

  error:
    # Never leak a stack trace or an internal exception message to an API client.
    # GlobalExceptionHandler already returns a proper ApiResponse for the exceptions
    # the app throws; this covers what escapes it.
    include-stacktrace: never
    include-message: never
    include-binding-errors: never
    whitelabel:
      enabled: false

  tomcat:
    threads:
      # 200 worker threads against a 30-connection database pool is intentional, not
      # a mismatch: most request time is spent outside the database (JSON
      # serialisation, BCrypt, the response write to a slow mobile client), so
      # threads outnumbering connections keeps the pool saturated. Raising the pool
      # to match the threads would just move the queue into PostgreSQL — and it costs
      # more there, since PostgreSQL forks a backend process per connection.
      max: 200
      min-spare: 20
    max-connections: 8192
    accept-count: 200
    connection-timeout: 20s
    # Cap the URI + query length. Defence against a request-header overflow probe.
    max-http-form-post-size: 25MB
    max-swallow-size: 25MB

  compression:
    # ON now. Under the previous setup nginx gzipped responses and doing it twice
    # wasted CPU; Koyeb's edge does not compress application responses, so without
    # this the JSON goes out raw — which is felt directly by a tenant on mobile
    # data, since the list endpoints are the biggest payloads in the API.
    enabled: true
    mime-types: application/json,application/xml,text/html,text/plain,text/css,application/javascript
    # Below ~1KB the compression costs more than it saves.
    min-response-size: 1024

spring:
  lifecycle:
    # Maximum drain time for graceful shutdown. Must be under the container's
    # stop_grace_period (45s).
    timeout-per-shutdown-phase: 30s

  # ---------------------------------------------------------------------------
  # Database
  # ---------------------------------------------------------------------------
  datasource:
    # ONE variable, not host/port/name/user/password assembled here.
    #
    # Every managed PostgreSQL provider (Neon, Supabase, Koyeb, RDS) hands you a
    # single connection string, and splitting it into parts means transcribing five
    # fields by hand into Koyeb's environment — where the failure mode for getting
    # one wrong is a startup error at 2am rather than a copy-paste. Paste the whole
    # thing into SPRING_DATASOURCE_URL instead.
    #
    # NO DEFAULT. A missing value must fail the context at startup rather than
    # silently fall back to the localhost URL committed in application.yml, which in
    # production would mean an app that boots, finds no database, and reports itself
    # unhealthy for a reason that is not obvious from the logs.
    #
    # The URL MUST carry `sslmode=require` (most providers already include it in the
    # string they give you — check). The database is reached across the public
    # internet here, unlike the Docker-network setup this replaced, and the
    # PostgreSQL driver's default is `prefer`: it will quietly fall back to an
    # UNENCRYPTED connection if the TLS handshake fails, carrying tenant data and
    # payment rows in the clear. `require` refuses instead. `verify-full` is stronger
    # still (it also checks the hostname against the certificate, defeating an active
    # MITM) and is worth using if your provider documents a CA bundle.
    #
    # Two parameters worth appending if the provider has not:
    #   reWriteBatchedInserts=true   collapses a JDBC batch into one multi-row INSERT
    #                                — what makes the CSV bulk import and the
    #                                api_request_log writes cheap
    #   ApplicationName=pg-manager-backend
    #                                labels the connection in pg_stat_activity, so
    #                                the provider's dashboard tells you which app a
    #                                slow query came from
    url: ${SPRING_DATASOURCE_URL}
    username: ${SPRING_DATASOURCE_USERNAME}
    password: ${SPRING_DATASOURCE_PASSWORD}
    driver-class-name: org.postgresql.Driver

    hikari:
      pool-name: pgm-pool
      # 10, not the 30 this used when the database was a dedicated container on the
      # same box. A managed instance enforces a connection ceiling (free tiers are
      # often 20-60 TOTAL), PostgreSQL forks a backend process per connection, and
      # Koyeb may run more than one instance of this service — so the real budget is
      # `maximum-pool-size x instance count`, and exceeding it fails as
      # "too many clients already" under exactly the load you added instances for.
      #
      # If your provider offers a POOLER endpoint (PgBouncer), prefer it in
      # SPRING_DATASOURCE_URL and raise this. One caveat: a pooler in transaction
      # mode cannot hold server-side prepared statements across a checkout, so append
      # `prepareThreshold=0` to the URL or you will see "prepared statement S_1
      # already exists" under concurrency.
      maximum-pool-size: ${DB_POOL_MAX:10}
      minimum-idle: ${DB_POOL_MIN:2}

      # Fail a request that cannot get a connection in 20s rather than letting
      # Tomcat threads pile up behind an exhausted pool.
      connection-timeout: 20000
      validation-timeout: 5000
      idle-timeout: 300000

      # MUST be lower than whatever idle timeout the managed provider enforces (and
      # than any idle timeout on the network path — a cloud load balancer will also
      # drop a quiet TCP connection). If the far end closes a connection the pool
      # still believes is good, the next query on it fails with "connection has been
      # closed". Check your provider's value; 540s (9 min) is under the common 10-min
      # default with a 60s margin.
      max-lifetime: 540000

      # Log a warning when a connection is held for over 30s. Almost always an
      # @Transactional method doing I/O — or a JdbcTemplate loop that should be a
      # single batched query.
      leak-detection-threshold: 30000

      # Cheap liveness probe. The PostgreSQL driver implements JDBC4 isValid(), so no
      # query is actually sent; this is here as an explicit fallback.
      connection-test-query: SELECT 1

  jpa:
    hibernate:
      # Unchanged from dev and must stay `validate`. The schema belongs to Flyway;
      # `update` in production would let Hibernate silently alter live tables.
      ddl-auto: validate
    open-in-view: false
    show-sql: false
    properties:
      hibernate:
        format_sql: false          # dev-only pretty printing; pure overhead here
        generate_statistics: false
        jdbc:
          batch_size: 50
          time_zone: ${TZ:Asia/Kolkata}
        order_inserts: true
        order_updates: true
        query:
          in_clause_parameter_padding: true   # better statement-cache reuse

  # ---------------------------------------------------------------------------
  # Flyway
  # ---------------------------------------------------------------------------
  flyway:
    enabled: true
    locations: classpath:db/migration

    # TRUE in production, unlike the dev default of false.
    #
    # Checksum validation is what catches an already-applied migration having been
    # edited after the fact — which silently leaves production on a different schema
    # from the one the code expects. If this fails on deploy, do NOT set it back to
    # false: work out which file changed, and run `flyway repair` only once you are
    # certain the applied schema is correct.
    validate-on-migrate: true

    # Refuse to run against a non-empty database with no history table. Turning this
    # on would let Flyway "adopt" an unknown schema and skip every earlier migration.
    baseline-on-migrate: false

    # `flyway clean` drops every object in the schema. There is no situation in which
    # that should be reachable in production.
    clean-disabled: true

    # NOTE on rolling back across a migration: Flyway's default
    # ignore-migration-patterns is `*:future`, so redeploying an OLDER image over a
    # database that has newer migrations applied does not fail here — it fails a
    # moment later, in Hibernate's ddl-auto=validate, with a less obvious message.
    #
    # Koyeb's one-click rollback swaps the IMAGE ONLY and knows nothing about your
    # schema, so rolling back across a release that added a migration needs a database
    # restore from the provider's point-in-time recovery too. Rolling FORWARD with a
    # fix is almost always the better option — see README.md.

  # ---------------------------------------------------------------------------
  # Redis
  # ---------------------------------------------------------------------------
  data:
    redis:
      host: ${REDIS_HOST}
      port: ${REDIS_PORT:6379}
      password: ${REDIS_PASSWORD:}
      ssl:
        # ON by default here, unlike the dev profile. Redis is now reached over the
        # public internet rather than a private Docker network, and every managed
        # provider (Upstash, Redis Cloud) requires TLS — the password is sent in the
        # first command of the connection, so a plaintext connection leaks the
        # credential itself, not just the cached values.
        #
        # Set REDIS_SSL=false only for a Redis on a private network you control.
        enabled: ${REDIS_SSL:true}
      # Short timeouts on purpose, and they matter more now than they did on a local
      # network: the cache is fail-open (CacheErrorHandler swallows failures and falls
      # through to a direct database read), so a slow or unreachable Redis must give
      # up fast rather than adding internet latency to every request on top of the
      # query it was meant to avoid.
      timeout: 2000ms
      connect-timeout: 2000ms
      lettuce:
        pool:
          enabled: true
          # Smaller than the 16 used against a co-located Redis: managed free tiers
          # cap concurrent connections (Upstash's is low), and this is multiplied by
          # the number of Koyeb instances.
          max-active: ${REDIS_POOL_MAX:8}
          max-idle: 4
          min-idle: 1
          max-wait: 1000ms
        shutdown-timeout: 200ms

  # ---------------------------------------------------------------------------
  # Mail — inherited from application.yml; only the pool timeouts differ.
  # An unreachable SMTP host must not hang the outbox dispatcher indefinitely.
  # ---------------------------------------------------------------------------
  mail:
    properties:
      mail:
        smtp:
          connectiontimeout: 5000
          timeout: 5000
          writetimeout: 5000

  # Cuts a little startup time and a lot of memory; nothing here exposes JMX beans.
  jmx:
    enabled: false

  threads:
    virtual:
      # Left OFF. Virtual threads pin to their carrier inside synchronized blocks,
      # which both Hikari's connection acquisition path and BCrypt hit. Enabling this
      # without load-testing the pool behaviour is a good way to make throughput worse.
      enabled: false

# =============================================================================
# Actuator — on a SEPARATE PORT (9091). Keep it that way.
#
# On Koyeb this means declaring TWO ports on the service: 8080 with a public HTTP
# route, and 9091 with NO route, carrying the health check
# (/actuator/health/readiness). Three things depend on the split:
#
#   1. api_request_log stays clean. ApiLogFilter has no path exclusions
#      (shouldNotFilter only consults logging.api.enabled), so a health probe on the
#      main port would be persisted like any other request — thousands of rows a
#      day, on the fastest-growing table in the schema. Spring Boot puts management
#      endpoints in a child context and does not register the parent's filter beans
#      there, so probes never reach the filter.
#
#   2. It is not routed, so it is not on the internet. Everything below is
#      UNAUTHENTICATED to anyone who can reach the port — which is precisely why it
#      must not get a public route. Giving 9091 a route publishes /actuator/metrics
#      to the world.
#
#   3. It needs no change to SecurityConfig — the parent filter chain does not
#      apply to the management port.
#
# DO NOT "simplify" this by setting MANAGEMENT_PORT=8080. Actuator then moves into
# the MAIN context, where SecurityConfig's `.anyRequest().authenticated()` applies:
# the health check gets 401, never passes, and Koyeb never brings the instance into
# rotation. The deploy just hangs and rolls back, with a 401 in the logs that looks
# like a credentials problem rather than a port one. If the platform genuinely
# cannot probe a second port, the fix is a `permitAll` for /actuator/health in
# SecurityConfig plus a path exclusion in ApiLogFilter — not this variable.
# =============================================================================
management:
  server:
    port: ${MANAGEMENT_PORT:9091}
    # Bind to all interfaces inside the container so the platform's health checker
    # can reach it. Safe only because the port carries no public route — see above.
    address: 0.0.0.0

  endpoints:
    web:
      exposure:
        # Minimum viable set. `env`, `configprops`, `beans`, `mappings` and
        # `heapdump` are all left off — on an unauthenticated port, `env` alone
        # would hand over the datasource password and the JWT secret.
        include: health,info,metrics
      base-path: /actuator

  endpoint:
    health:
      # Never expose component detail. Aggregated UP/DOWN only, so the public
      # /health endpoint cannot be used to fingerprint the infrastructure.
      show-details: never
      show-components: never
      probes:
        enabled: true
      group:
        # Liveness = "is this JVM still functioning". Deliberately does NOT include
        # the database: a PostgreSQL outage must not cause the container to be reported
        # dead and restarted, because restarting the API does not fix PostgreSQL and a
        # crash-loop makes recovery slower.
        liveness:
          include: livenessState,ping
        # Readiness = "can this instance serve requests". Includes the database,
        # because it cannot. This is the endpoint Koyeb's health check must target,
        # and the gate that decides whether a new deploy takes traffic.
        #
        # Redis is EXCLUDED on purpose: the cache is fail-open (CacheErrorHandler
        # swallows failures and falls through to a direct DB read), so a Redis
        # outage degrades latency but not correctness. Including it would take a
        # perfectly serviceable instance out of rotation and, during a deploy, would
        # make deploy.sh roll back a healthy release.
        readiness:
          include: readinessState,db
    info:
      enabled: true

  health:
    # Explicitly off rather than merely excluded from the groups above — this also
    # keeps it out of the aggregate status reported at /actuator/health.
    redis:
      enabled: false
    mail:
      # Would open an SMTP connection on every probe, and is meaningless when
      # EMAIL_ENABLED is false.
      enabled: false
    diskspace:
      enabled: true
      threshold: 500MB

  info:
    env:
      enabled: true
    java:
      enabled: true
    os:
      enabled: true

  metrics:
    tags:
      application: pg-manager-backend
      environment: production

# =============================================================================
# Application settings
# =============================================================================
app:
  security:
    # NO DEFAULT. A missing JWT_SECRET fails the context at startup.
    #
    # This is the whole point of the prod profile: application.yml carries a
    # committed development secret, and inheriting it in production would mean every
    # deployment of this codebase signs tokens with a value that is public in the
    # repository — trivially forgeable admin tokens for any organization.
    #
    # Changing it later invalidates all issued tokens AND every printed tenant
    # self check-in QR code (SelfCheckinTokenService signs the URL with the same key).
    jwt-secret: ${JWT_SECRET}
    access-token-minutes: ${ACCESS_TOKEN_MINUTES:30}
    refresh-token-days: ${REFRESH_TOKEN_DAYS:14}

  cache:
    enabled: ${CACHE_ENABLED:true}

  # Origin embedded in the tenant self check-in QR. Must be the public HTTPS domain:
  # a tenant scans this on a phone that is not on the LAN, and the dev default is a
  # private 192.168.x.x address that would simply not resolve for them.
  public-base-url: ${APP_PUBLIC_BASE_URL}

  messaging:
    email:
      enabled: ${EMAIL_ENABLED:false}
      from: ${EMAIL_FROM:no-reply@pgmanager.app}
      from-name: ${EMAIL_FROM_NAME:PG Manager}

# =============================================================================
# API docs
#
# Off by default. The OpenAPI document enumerates every endpoint, every role guard
# and every DTO field in the system — a complete map for anyone probing the API.
#
# THIS IS NOW THE ONLY LOCK. Under the previous setup nginx also returned 403 for
# these paths, so exposing the docs took two mistakes; there is no nginx in front of
# the app on Koyeb, and SecurityConfig deliberately permitAll's `/swagger-ui/**` and
# `/v3/api-docs/**` (they are useless behind auth). So setting SWAGGER_ENABLED=true
# in the Koyeb environment publishes the full API map to the internet immediately,
# with nothing behind it. Turn it on to debug, turn it off again.
# =============================================================================
springdoc:
  api-docs:
    enabled: ${SWAGGER_ENABLED:false}
  swagger-ui:
    enabled: ${SWAGGER_ENABLED:false}
    path: /swagger-ui.html

# =============================================================================
# Logging
#
# stdout ONLY. The previous setup also wrote a rolling file to a Docker volume,
# which is actively wrong on a managed platform: the container filesystem is
# ephemeral, so a "persistent" log is lost on every deploy, restart and scale event
# — while still consuming the container's disk and eventually filling it. Koyeb
# captures stdout and that is the only copy that survives.
#
# Note this is application logging only. The per-request audit trail is the separate
# `apilog` framework writing to api_request_log — which IS durable, because it is in
# the database. That is where to look for what a client actually sent.
# =============================================================================
logging:
  level:
    root: INFO
    com.pgmanager: ${LOG_LEVEL_APP:INFO}

    # Explicitly pinned rather than left to inherit, because each of these is a
    # known source of production noise or a known leak:
    org.springframework: WARN
    org.hibernate: WARN
    # WARN, not INFO: at INFO this logs every statement's bind parameters, which for
    # this schema means tenant mobile numbers and payment amounts in plain text.
    org.hibernate.SQL: WARN
    org.hibernate.orm.jdbc.bind: WARN
    com.zaxxer.hikari: WARN
    # INFO so migration application is visible in the deploy log — it is the single
    # most useful line when a release fails to start.
    org.flywaydb: INFO
    # WARN: at INFO, Spring Security logs an entry per authentication attempt.
    org.springframework.security: WARN
    org.springframework.web: WARN

  pattern:
    # Timestamp INCLUDED, unlike the previous Docker setup where the json-file driver
    # stamped every line and two timestamps made the output hard to read. Koyeb's log
    # viewer shows its own ingest time, which is not the same instant as the event —
    # so without this you cannot correlate a log line with an api_request_log row.
    console: "%d{yyyy-MM-dd HH:mm:ss.SSS} %-5level [%thread] %logger{36} - %msg%n"
